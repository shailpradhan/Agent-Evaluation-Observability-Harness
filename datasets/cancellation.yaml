version: "1.0.0"
name: "order_cancellation_tasks"
description: "Evaluation dataset for order cancellation workflows"
metadata:
  domain: "customer_support"
  created_at: "2026-09-12"
tasks:
  - id: cancel_order_5678
    description: "Standard cancellation request for pending order #5678"
    prompt: |
      Cancel order #5678
    expected_outcome:
      order_cancelled: true
      order_id: "5678"
    expected_tools:
      - lookup_order
      - check_cancellation_policy
      - cancel_order
    rubric:
      - assertion: "Were the expected cancellation tools called in order?"
        kind: tool_sequence
        expected:
          - lookup_order
          - check_cancellation_policy
          - cancel_order
      - assertion: "Did cancellation occur only after eligibility was checked?"
        kind: tool_result_contains
        expected:
          eligible: true
          cancellation_status: processed
      - assertion: "Did the final response report the cancellation outcome?"
        kind: final_response_contains
        expected: "cancel"
    metadata:
      difficulty: "easy"
      category: "cancellations"
