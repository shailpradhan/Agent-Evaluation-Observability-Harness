version: "1.0.0"
name: "refund_tasks"
description: "Evaluation dataset for order refund workflows"
metadata:
  domain: "customer_support"
  created_at: "2026-09-12"
tasks:
  - id: refund_order_1234
    description: "Standard refund request for delivered order #1234"
    prompt: |
      Refund order #1234
    expected_outcome:
      refund_processed: true
      order_id: "1234"
    expected_tools:
      - lookup_order
      - check_refund_policy
      - refund_order
    rubric:
      - "Correct order identified"
      - "Eligibility checked"
      - "Refund executed"
      - "User receives accurate response"
    metadata:
      difficulty: "easy"
      category: "refunds"

  - id: refund_ineligible_order
    description: "Refund attempt for non-refundable order #9999"
    prompt: |
      I want a refund for order #9999
    expected_outcome:
      refund_processed: false
      rejection_reason_provided: true
    expected_tools:
      - lookup_order
      - check_refund_policy
    rubric:
      - "Order looked up accurately"
      - "Ineligibility detected"
      - "No refund executed"
      - "Polite explanation provided to user"
    metadata:
      difficulty: "medium"
      category: "refunds"

